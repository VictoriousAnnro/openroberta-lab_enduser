# OpenRoberta Lab Nginx Configuration
# Place this file in: /etc/nginx/sites-available/openroberta
# Create symlink: sudo ln -s /etc/nginx/sites-available/openroberta /etc/nginx/sites-enabled/

# OpenRoberta Lab Main Server
server {
    listen 80;
    listen [::]:80;
    server_name openroberta.yourdomain.com;

    # Logging
    access_log /var/log/nginx/openroberta-access.log;
    error_log /var/log/nginx/openroberta-error.log;

    # Proxy to OpenRoberta Lab Server (port 1999)
    location / {
        proxy_pass http://localhost:1999;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket endpoint (if needed)
    location /ws {
        proxy_pass http://localhost:1999;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}

# MuJoCo API Server
server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    # Logging
    access_log /var/log/nginx/mujoco-api-access.log;
    error_log /var/log/nginx/mujoco-api-error.log;

    # Proxy to Flask API Server (port 5000)
    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS headers (handled by Flask, but can be added here as backup)
        add_header Access-Control-Allow-Origin https://openroberta.yourdomain.com always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        
        # Timeouts for longer API calls
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
