# Nginx Configuration for IP-based Access (No Domain Required)
# Place this file in: /etc/nginx/sites-available/openroberta
# Create symlink: sudo ln -s /etc/nginx/sites-available/openroberta /etc/nginx/sites-enabled/

# Default server for IP-based access
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Accept requests to any hostname (IP address)
    server_name _;

    # Logging
    access_log /var/log/nginx/openroberta-access.log;
    error_log /var/log/nginx/openroberta-error.log;

    # Root location - OpenRoberta Lab Server (port 1999)
    location / {
        proxy_pass http://localhost:1999;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # API endpoint - MuJoCo Flask Server (port 5000)
    location /api/ {
        # Remove /api prefix and pass to Flask
        rewrite ^/api/(.*) /$1 break;
        
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS headers (backup - Flask should handle this)
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        
        # Timeouts for longer API calls
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # WebSocket endpoint (if needed)
    location /ws {
        proxy_pass http://localhost:1999;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
